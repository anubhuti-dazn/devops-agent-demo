name: CI

on:
  push:
    branches: ["main", "feature/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: pip install flake8 ruff

      - name: Run flake8
        run: flake8 app/ tests/ --max-line-length=120

      - name: Run ruff
        run: ruff check app/ tests/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: test-secret-key
      # CloudWatch is disabled during tests (no AWS creds supplied)
      AWS_REGION: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-agent-demo:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name app -p 8000:8000 \
            -e AWS_REGION="" \
            devops-agent-demo:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8000/health || (docker logs app && exit 1)
          docker stop app

  notify-cloudwatch:
    name: Notify CloudWatch on CI failure
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: failure() && vars.CW_ENABLED == 'true'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send CI failure event to CloudWatch
        run: |
          aws logs put-log-events \
            --log-group-name "/devops-agent-demo/ci" \
            --log-stream-name "github-actions" \
            --log-events timestamp=$(date +%s%3N),message="{\"level\":\"ERROR\",\"event\":\"ci_failure\",\"repo\":\"${{ github.repository }}\",\"run_id\":\"${{ github.run_id }}\",\"commit\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"run_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            2>/dev/null || echo "CloudWatch log stream may need creation — see setup docs"
